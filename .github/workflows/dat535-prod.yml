name: DAT535 - Production Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lab:
        description: Stage to run
        required: true
        default: all
        type: choice
        options: [all, bronze, silver, gold]

# one run at a time per output folder (dev / prod)
concurrency:
  group: dat535-prod
  cancel-in-progress: false

jobs:
  deploy-prod:
    name: Deploy to Production
    runs-on: self-hosted
    environment: main
    env:
      DAT535_ENV: prod
      PYTHONUNBUFFERED: "1"
      DAT535_OUTPUT_DIR: /tmp/spark-lab-data/prod
      DAT535_RAW_DIR: /tmp/spark-lab-data/raw
      DAT535_YEARS: "2025"
      SPARK_HOME: /opt/spark
      JAVA_HOME: /usr/lib/jvm/java-8-openjdk-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Production Pipeline
        run: |
          source ~/spark-env/bin/activate
          
          STAGE="${{ github.event.inputs.lab || 'all' }}"
          echo "=== Running Production Pipeline ($STAGE) ==="
          python $GITHUB_WORKSPACE/run_pipeline.py $STAGE

      - name: Upload Production artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prod-outputs-${{ github.run_number }}
          path: |
            /tmp/spark-lab-data/prod/logs/
            /tmp/spark-lab-data/prod/bronze/manifests/
            /tmp/spark-lab-data/prod/silver/_READY.json
            /tmp/spark-lab-data/prod/silver/runs/*/quality_report.json
            /tmp/spark-lab-data/prod/silver/quality_history.jsonl
            /tmp/spark-lab-data/prod/gold/_READY.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Write pipeline summary
        run: |
          echo "## Production Pipeline Run" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Run # | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Stages | ${{ github.event.inputs.lab || 'all' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY